name: Season 2 Preview

on:
  pull_request:
    paths:
      - 'preview/**'
      - '.github/workflows/preview-ci.yml'
  push:
    branches:
      - 'codex/**'
    paths:
      - 'preview/**'
      - '.github/workflows/preview-ci.yml'

permissions:
  contents: read

concurrency:
  group: season-2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
