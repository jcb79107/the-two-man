name: Season 2 Preview

on:
  pull_request:
    paths:
      - 'preview/**'
      - '.github/workflows/preview-ci.yml'
  push:
    branches:
      - 'codex/**'
      - main
    paths:
      - 'preview/**'
      - '.github/workflows/preview-ci.yml'

permissions:
  contents: read

concurrency:
  group: season-2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build:live
      - run: npm run test:offseason
